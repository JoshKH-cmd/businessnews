name: Daily news briefing

on:
  schedule:
    # GitHub schedules use UTC. These two runs cover 08:30 UK time
    # in winter and summer; the script ignores the run outside UK 08:00.
    - cron: "30 7 * * *"
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build briefing
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python scripts/daily_news.py

      - name: Commit briefing
        run: |
          if [ -n "$(git status --porcelain docs/daily-briefing.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/daily-briefing.md
            git commit -m "Publish daily news briefing"
            git push
          else
            echo "The briefing has not changed."
          fi
